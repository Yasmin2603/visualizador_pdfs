<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz a partir de PDF</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f5bea;--ok:#15803d;--okbg:#e3f4e9;--er:#b91c1c;--erbg:#fde8e8;--rv:#b45309;--rvbg:#fdf0dc;--bd:#e2e5ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mut:#98a1b5;--ac:#7c9cff;--ok:#6fd395;--okbg:#1b3326;--er:#f28b8b;--erbg:#3a1d1d;--rv:#f0b35f;--rvbg:#38290f;--bd:#2c3340}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--ac)}
#top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
#top h1{font-size:1.05rem;margin:0;flex:1;min-width:160px}
button,.btn{padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
select{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#layout{display:flex;min-height:calc(100vh - 54px)}
#main{flex:1;min-width:0;padding:16px;max-width:1000px;margin:auto}
#side{display:none;width:44%;min-width:320px;border-left:1px solid var(--bd);background:var(--card);flex-direction:column;position:sticky;top:54px;height:calc(100vh - 54px)}
#side.show{display:flex}
#side .sh{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd)}
#side iframe{flex:1;border:0;background:#fff}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-width:38px;padding:6px 10px;border-radius:999px;font-size:.85rem}
.chip.cur{outline:2px solid var(--ac)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.chip.err{background:var(--erbg);color:var(--er);border-color:var(--er)}
.chip.rev{background:var(--rvbg);color:var(--rv);border-color:var(--rv)}
.qh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.qh b{font-size:1.15rem}.qh span{color:var(--mut);font-size:.9rem}
.qbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px;overflow:auto;max-height:70vh}
.qbox canvas{display:block}
.stem{margin-top:8px}
textarea{width:100%;min-height:90px;margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.g-ok{border-color:var(--ok);color:var(--ok)}.g-ok.on{background:var(--ok);color:#fff}
.g-er{border-color:var(--er);color:var(--er)}.g-er.on{background:var(--er);color:#fff}
.g-rv{border-color:var(--rv);color:var(--rv)}.g-rv.on{background:var(--rv);color:#fff}
.sp{flex:1}
.msg{padding:40px 10px;text-align:center;color:var(--mut)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mut);margin-top:20px;cursor:pointer}
.drop.over{border-color:var(--ac);color:var(--ac)}
table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92rem}
.big{font-size:1.6rem;font-weight:700}
</style></head><body>
<div id="top">
 <a class="btn" href="index.html">← Biblioteca</a>
 <h1 id="title">Quiz a partir de PDF</h1>
 <button id="bItens" title="Separar questões com itens a), b), c)… em cards individuais">Dividir em itens</button>
 <button id="bZo">−</button><button id="bZi">+</button>
 <button id="bSide">📖 Material</button>
 <button id="bOpen">📂 Outro PDF</button>
 <input id="file" type="file" accept="application/pdf" hidden>
</div>
<div id="layout">
 <div id="main"><div class="msg" id="status"></div></div>
 <div id="side"><div class="sh"><select id="sel"></select><span style="flex:1"></span><button id="bSideX">✕</button></div><iframe id="sfr"></iframe></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="lib.js"></script>
<script>
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const RS=2, MAXGAP=34;
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdf=null,pages=[],heads=[],allSegs=[],segs=[],idx=0,itemized=false,redo=false,zoom=1,store={},qid="",sideItems=[],pageCache={},segCache={},view="quiz",noHeads=false;

function setStatus(t){$("#main").innerHTML=`<div class="msg">${t}</div>`}
function dropZone(extra){
 $("#main").innerHTML=`${extra||""}<div class="drop" id="dz"><p><b>Solte um PDF aqui</b> ou clique para escolher.</p><p>O quiz identifica as questões ("1ª Questão", "2ª Questão"…) e transforma cada uma em um card. Para usar uma prova da biblioteca, clique em 🎯 Quiz no card dela.</p></div>`;
 const dz=$("#dz");dz.onclick=()=>$("#file").click();
 dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");
 dz.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadFile(f)}}
$("#bOpen").onclick=()=>$("#file").click();
$("#file").onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
async function loadFile(f){const buf=await f.arrayBuffer();start({data:buf},"file:"+f.name+":"+f.size,f.name,await formItems())}
async function formItems(){const fd=(await DB.all()).find(d=>d.kind==="formulario");return fd?[["Formulário",URL.createObjectURL(fd.blob)]]:[]}

/* ---------- detecção das questões ---------- */
async function scan(){
 pages=[];heads=[];pageCache={};segCache={};
 for(let p=1;p<=pdf.numPages;p++){
  const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
  const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],h:Math.abs(i.transform[3])||10}));
  its.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of its){const L=lines.find(l=>Math.abs(l.y-it.y)<=3);if(L){L.items.push(it);L.h=Math.max(L.h,it.h)}else lines.push({y:it.y,h:it.h,items:[it]})}
  lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.t=l.items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()});
  lines.sort((a,b)=>b.y-a.y);
  pages.push({H:vp.height,W:vp.width});
  for(const l of lines){
   let m=l.t.match(/^(\d+)\s*[ªº°a]?\s*Quest[ãa]o/i);
   const pt=(l.t.match(/\((\d+(?:[.,]\d+)?)\s*pontos?\)/i)||[])[1];
   const pts=pt?parseFloat(pt.replace(",",".")):null;
   if(m){heads.push({n:+m[1],page:p,y:l.y,h:l.h,pts,items:[]});continue}
   m=l.t.match(/^([a-h])\)\s/i);
   if(m&&heads.length)heads[heads.length-1].items.push({letter:m[1].toLowerCase(),page:p,y:l.y,h:l.h,pts});
  }
 }
 noHeads=!heads.length;
}
function pieces(sp,stop,ep,ebot){
 const out=[];
 for(let p=sp;p<=(ep||pdf.numPages);p++){
  const H=pages[p-1].H,top=(p===sp)?stop:H,bot=(ep&&p===ep)?ebot:0;
  if(top>bot)out.push({page:p,top,bot})}
 return out}
function build(){
 const out=[];
 if(noHeads){pages.forEach((pg,i)=>out.push({id:"p"+(i+1),label:"Página "+(i+1),pts:null,pcs:[{page:i+1,top:pg.H,bot:0}]}))}
 else heads.forEach((q,qi)=>{
  const nx=heads[qi+1],nxP=nx?nx.page:null,nxB=nx?nx.y+nx.h+12:0,top=q.y+q.h+2;
  const full=pieces(q.page,top,nxP,nxB);
  if(itemized&&q.items.length>=2){
   const stem=pieces(q.page,top,q.items[0].page,q.items[0].y+q.items[0].h+4);
   q.items.forEach((it,j)=>{const n2=q.items[j+1];
    out.push({id:`q${q.n}${it.letter}`,label:`Questão ${q.n} · item ${it.letter})`,pts:it.pts,
     pcs:pieces(it.page,it.y+it.h+2,n2?n2.page:nxP,n2?n2.y+n2.h+4:nxB),stem:stem,full:full})})
  }else out.push({id:"q"+q.n,label:"Questão "+q.n,pts:q.pts,pcs:full})});
 allSegs=out;applyRedo()}
function applyRedo(){segs=redo?allSegs.filter(s=>st(s)!=="ok"):allSegs;if(!segs.length){redo=false;segs=allSegs}}

/* ---------- renderização dos recortes ---------- */
async function pageCanvas(p){
 if(pageCache[p])return pageCache[p];
 const pg=await pdf.getPage(p),vp=pg.getViewport({scale:RS}),c=document.createElement("canvas");
 c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;return pageCache[p]=c}
function squeeze(c){ // tira bordas brancas e encolhe vãos brancos grandes
 const w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data,rows=new Array(h).fill(false);let x0=w,x1=-1;
 for(let y=0;y<h;y++){const o=y*w*4;for(let x=0;x<w;x++){const i=o+x*4;if(d[i]<235||d[i+1]<235||d[i+2]<235){rows[y]=true;if(x<x0)x0=x;if(x>x1)x1=x}}}
 const runs=[];let y=0;
 while(y<h){if(!rows[y]){y++;continue}let s=y;while(y<h&&rows[y])y++;runs.push([s,y])}
 if(!runs.length)return null;
 const blocks=[];let cur=runs[0].slice();
 for(let i=1;i<runs.length;i++){const gap=runs[i][0]-cur[1];if(gap<=MAXGAP)cur[1]=runs[i][1];else{blocks.push(cur);cur=runs[i].slice()}}
 blocks.push(cur);
 const total=blocks.reduce((a,b)=>a+(b[1]-b[0]),0)+MAXGAP*(blocks.length-1)+16;
 const out=document.createElement("canvas");out.width=w;out.height=total;const x=out.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,total);
 let yy=8;blocks.forEach(b=>{x.drawImage(c,0,b[0],w,b[1]-b[0],0,yy,w,b[1]-b[0]);yy+=(b[1]-b[0])+MAXGAP});
 return {c:out,x0,x1}}
async function renderPieces(pcs){
 const parts=[];
 for(const pc of pcs){
  const src=await pageCanvas(pc.page),H=pages[pc.page-1].H;
  const sy=Math.max(0,Math.round((H-pc.top)*RS)),ey=Math.min(src.height,Math.round((H-pc.bot)*RS));
  if(ey-sy<6)continue;
  const c=document.createElement("canvas");c.width=src.width;c.height=ey-sy;c.getContext("2d").drawImage(src,0,sy,src.width,ey-sy,0,0,src.width,ey-sy);
  const r=squeeze(c);if(r)parts.push(r)}
 if(!parts.length)return null;
 const x0=Math.max(0,Math.min(...parts.map(p=>p.x0))-12),x1=Math.max(...parts.map(p=>p.x1))+12,w=x1-x0;
 const h=parts.reduce((a,p)=>a+p.c.height,0);
 const out=document.createElement("canvas");out.width=w;out.height=h;const x=out.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);
 let y=0;parts.forEach(p=>{x.drawImage(p.c,x0,0,w,p.c.height,0,y,w,p.c.height);y+=p.c.height});return out}
async function segCanvas(s,which){
 const k=s.id+"|"+which+"|"+itemized;if(segCache[k])return segCache[k];
 return segCache[k]=await renderPieces(which==="full"?s.full:which==="stem"?s.stem:s.pcs)}
function place(el,cv){el.innerHTML="";if(!cv){el.innerHTML='<div class="msg">Não consegui recortar esta questão.</div>';return}
 cv.style.width=Math.round(cv.width/RS*1.35*zoom)+"px";cv.style.maxWidth="none";el.appendChild(cv)}

/* ---------- estado / progresso ---------- */
function load(){try{store=JSON.parse(localStorage.getItem("vpdf:quiz:"+qid)||"{}")}catch(e){store={}}}
function persist(){try{localStorage.setItem("vpdf:quiz:"+qid,JSON.stringify(store))}catch(e){}}
const st=s=>(store[s.id]||{}).s||"";
function chips(){return `<div id="chips">`+segs.map((s,i)=>`<button class="chip ${st(s)} ${i===idx&&view==="quiz"?"cur":""}" data-i="${i}" title="${s.label}">${s.label.replace(/^Questão /,"").replace(" · item ","")}</button>`).join("")+`<button class="chip ${view==="sum"?"cur":""}" data-i="sum">📊 Resultado</button></div>`}
function bindChips(){$("#main").querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{if(b.dataset.i==="sum")view="sum";else{view="quiz";idx=+b.dataset.i}show()})}

/* ---------- telas ---------- */
async function show(){
 if(view==="sum")return summary();
 const s=segs[idx];if(!s)return;
 const rec=store[s.id]||{};
 $("#main").innerHTML=`${noHeads?'<div class="msg" style="padding:0 0 10px">Não achei títulos "1ª Questão" neste PDF; dividi por página.</div>':""}${redo?'<div class="msg" style="padding:0 0 10px">Modo revisão: só o que você ainda não acertou.</div>':""}${chips()}
 <div class="qh"><b>${s.label}</b><span>${s.pts!=null?s.pts+" pontos · ":""}${idx+1} de ${segs.length}</span></div>
 ${s.stem?`<div class="row" style="margin:0 0 8px"><button id="bStem">Ver enunciado completo da questão</button></div><div id="stemBox" class="qbox stem" hidden></div>`:""}
 <div class="qbox" id="qb"><div class="msg">Recortando…</div></div>
 <textarea id="note" placeholder="Seu rascunho / resposta (fica salvo neste navegador)">${(rec.n||"").replace(/</g,"&lt;")}</textarea>
 <div class="row">
  <button id="bSide2">📖 Ver gabarito / formulário</button><span class="sp"></span>
  <button class="g-ok ${rec.s==="ok"?"on":""}" data-g="ok">✅ Acertei (1)</button>
  <button class="g-er ${rec.s==="err"?"on":""}" data-g="err">❌ Errei (2)</button>
  <button class="g-rv ${rec.s==="rev"?"on":""}" data-g="rev">🔖 Revisar (3)</button>
 </div>
 <div class="row"><button id="bPrev" ${idx===0?"disabled":""}>◀ Anterior</button><span class="sp"></span><button id="bNext">${idx===segs.length-1?"Ver resultado ▶":"Próxima ▶"}</button></div>`;
 bindChips();
 $("#note").oninput=e=>{(store[s.id]=store[s.id]||{}).n=e.target.value;persist()};
 $("#main").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(b.dataset.g));
 $("#bSide2").onclick=()=>toggleSide(true);
 $("#bPrev").onclick=()=>go(-1);$("#bNext").onclick=()=>go(1);
 if(s.stem){$("#bStem").onclick=async()=>{const b=$("#stemBox");if(b.hidden){b.hidden=false;b.innerHTML='<div class="msg">Recortando…</div>';place(b,await segCanvas(s,"full"));$("#bStem").textContent="Esconder enunciado completo"}else{b.hidden=true;$("#bStem").textContent="Ver enunciado completo da questão"}}}
 const cv=await segCanvas(s,"pcs");if(segs[idx]===s&&view==="quiz")place($("#qb"),cv)}
function grade(g){const s=segs[idx];const r=store[s.id]=store[s.id]||{};r.s=(r.s===g?"":g);persist();show()}
function go(d){const n=idx+d;if(n>=segs.length)view="sum";else if(n>=0){idx=n;view="quiz"}show();window.scrollTo(0,0)}
function summary(){
 const all=allSegs,tot=all.reduce((a,s)=>a+(s.pts||0),0),useW=tot>0;
 const w=s=>useW?(s.pts||0):1,T=all.reduce((a,s)=>a+w(s),0);
 const got=all.filter(s=>st(s)==="ok").reduce((a,s)=>a+w(s),0);
 const cnt=k=>all.filter(s=>st(s)===k).length,pend=all.filter(s=>!st(s)).length;
 const fmt=n=>n%1?n.toFixed(1):String(n);
 $("#main").innerHTML=`${chips()}
 <div class="qh"><b>Resultado</b><span>${all.length} cards</span></div>
 <p class="big">${useW?fmt(got)+" / "+fmt(T)+" pontos":got+" / "+T+" acertos"}</p>
 <p>✅ ${cnt("ok")} acertei · ❌ ${cnt("err")} errei · 🔖 ${cnt("rev")} revisar · ⬜ ${pend} sem marcar</p>
 <div class="row"><button id="bRedo" ${cnt("err")+cnt("rev")+pend?"":"disabled"}>${redo?"Ver todas as questões":"Refazer só o que não acertei"}</button><button id="bReset">Zerar este quiz</button></div>
 <table><tr><th>Card</th><th>Pontos</th><th>Status</th></tr>${segs.map((s,i)=>`<tr><td><a href="#" data-i="${i}">${s.label}</a></td><td>${s.pts??"–"}</td><td>${{ok:"✅ acertei",err:"❌ errei",rev:"🔖 revisar","":"⬜"}[st(s)]}</td></tr>`).join("")}</table>`;
 bindChips();
 $("#main").querySelectorAll("td a").forEach(a=>a.onclick=e=>{e.preventDefault();view="quiz";idx=+a.dataset.i;show()});
 $("#bReset").onclick=()=>{if(confirm("Apagar as marcações e rascunhos deste quiz?")){store={};persist();redo=false;applyRedo();view="quiz";idx=0;show()}};
 $("#bRedo").onclick=()=>{redo=!redo;applyRedo();idx=0;view="quiz";show()}}

/* ---------- painel lateral ---------- */
function setupSide(){
 $("#sel").innerHTML=sideItems.map(x=>`<option value="${x[1]}">${esc(x[0])}</option>`).join("");
 $("#bSide").disabled=!sideItems.length;
 $("#sel").onchange=()=>$("#sfr").src=$("#sel").value}
function toggleSide(force){if(!sideItems.length)return;const s=$("#side");const on=force??!s.classList.contains("show");s.classList.toggle("show",on);$("#bSide").classList.toggle("on",on);if(on&&!$("#sfr").getAttribute("src"))$("#sfr").src=$("#sel").value}
$("#bSide").onclick=()=>toggleSide();$("#bSideX").onclick=()=>toggleSide(false);
$("#bZi").onclick=()=>{zoom=Math.min(2.5,zoom*1.2);show()};$("#bZo").onclick=()=>{zoom=Math.max(.5,zoom/1.2);show()};
$("#bItens").onclick=()=>{if(!pdf)return;itemized=!itemized;$("#bItens").classList.toggle("on",itemized);build();idx=0;view="quiz";show()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA"||!segs.length)return;
 if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
 else if(view==="quiz"&&"123".includes(e.key)&&e.key.length===1)grade({1:"ok",2:"err",3:"rev"}[e.key])});

/* ---------- início ---------- */
async function start(src,id,title,side){
 qid=id;sideItems=side||[];redo=false;$("#title").textContent="Quiz · "+(title||"PDF");
 setStatus("Lendo o PDF e identificando as questões…");
 try{pdf=await pdfjsLib.getDocument(src).promise}catch(e){dropZone('<div class="msg">Não consegui abrir o PDF. Escolha o arquivo manualmente.</div>');return}
 await scan();load();build();setupSide();idx=0;view="quiz";show()}
(async()=>{
 const id=P.get("doc");
 if(!id){dropZone();return}
 const d=await DB.get(id);
 if(!d){dropZone('<div class="msg">Esse PDF não está mais na biblioteca.</div>');return}
 const all=await DB.all(),side=[],g=all.find(x=>x.id===d.pair),fd=all.find(x=>x.kind==="formulario");
 if(g)side.push(["Gabarito",URL.createObjectURL(g.blob)]);
 if(fd)side.push(["Formulário",URL.createObjectURL(fd.blob)]);
 start({data:await d.blob.arrayBuffer()},id,d.title,side)})();
</script></body></html>
