<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizador de provas em PDF</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f5bea;--ok:#15803d;--okbg:#e3f4e9;--bd:#e2e5ec;--warn:#b45309;--warnbg:#fdf0dc}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf2;--mut:#98a1b5;--ac:#7c9cff;--ok:#6fd395;--okbg:#1b3326;--bd:#2c3340;--warn:#f0b35f;--warnbg:#38290f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:26px 20px 6px;max-width:960px;margin:auto}
h1{margin:0 0 4px;font-size:1.6rem}header p{margin:0;color:var(--mut)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.bar2{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:.88rem}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
.prog .t{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin:14px 0 6px}
.prog .bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.stats{margin-top:12px;color:var(--mut);font-size:.9rem}
main{margin:12px auto 40px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card.done{opacity:.72}.card.done .per{text-decoration:line-through}
.ck{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
.per{font-weight:700;font-size:1.1rem;min-width:70px}
.info{flex:1;min-width:180px}.info b{display:block}.info span{color:var(--mut);font-size:.86rem;word-break:break-all}
.tag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:.75rem;background:var(--warnbg);color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.b,a.b,button.act{padding:8px 14px;border-radius:9px;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer;font-size:.9rem;text-decoration:none}
button.act{background:var(--ac);color:#fff}
button.g{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
button.ic{padding:8px 10px;border-color:var(--bd);color:var(--mut)}
.off{padding:8px 14px;border-radius:9px;border:1px dashed var(--bd);color:var(--mut);font-size:.85rem}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:34px 20px;text-align:center;color:var(--mut);margin-top:18px}
.drop.over{border-color:var(--ac);color:var(--ac)}
.forms{margin-top:12px;font-size:.9rem;color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px;width:min(420px,92vw)}
dialog label{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--mut)}
dialog input,dialog select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:.95rem}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:16px 0 0}
dialog h3{margin:0}
/* visualizador */
#vw{position:fixed;inset:0;background:#2b2f38;display:none;flex-direction:column;z-index:20;color:#eef}
#vw.show{display:flex}
#tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:#1b1e25;border-bottom:1px solid #000}
#tb .ttl{flex:1;min-width:140px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tb button{padding:7px 11px;border-radius:8px;border:1px solid #444b5a;background:#2a2f3a;color:#eef;cursor:pointer;font-size:.88rem}
#tb button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#tb button:disabled{opacity:.35;cursor:default}
#tb label{display:flex;gap:6px;align-items:center;font-size:.88rem;cursor:pointer}
#zl{min-width:48px;text-align:center;font-size:.88rem}
#panes{flex:1;display:flex;min-height:0}
.pane{flex:1;overflow:auto;position:relative;background:#3a3f4b;min-width:0}
.pane+.pane{border-left:3px solid #000}
.pane .lab{position:sticky;top:0;z-index:2;background:#000b;color:#fff;font-size:.78rem;padding:3px 10px;width:max-content;border-radius:0 0 8px 0}
.pane .pg{padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:max-content}
.pane canvas{background:#fff;box-shadow:0 2px 12px #0008;display:block}
.msg{padding:30px;text-align:center;color:#cfd4e3}
</style></head><body>
<header><h1>Visualizador de provas em PDF</h1>
<p>Carregue seus PDFs, acompanhe o que já fez, estude com zoom, gabarito ao lado e quiz. Tudo fica no seu navegador.</p></header>
<div class="wrap">
 <div class="bar2">
  <input id="q" type="search" placeholder="Buscar por título, período, turma…">
  <button class="act" id="bAdd">➕ Adicionar PDFs</button>
  <button class="b" id="bDir">📁 Adicionar pasta</button>
  <button class="b" id="bPair" title="Liga cada gabarito à prova do mesmo período e turma">🔗 Parear gabaritos</button>
  <button class="b" id="bExp" title="Baixa um arquivo com marcações, títulos e vínculos (sem os PDFs)">⬇ Backup</button>
  <button class="b" id="bImp">⬆ Restaurar</button>
  <input id="fAdd" type="file" accept="application/pdf" multiple hidden>
  <input id="fDir" type="file" webkitdirectory hidden>
  <input id="fImp" type="file" accept="application/json" hidden>
 </div>
 <div class="bar2" id="chips">
  <button class="chip on" data-g="s" data-f="all">Todas</button>
  <button class="chip" data-g="s" data-f="todo">Pendentes</button>
  <button class="chip" data-g="s" data-f="done">Feitas</button>
  <span class="sep"></span>
  <button class="chip on" data-g="k" data-f="all">Qualquer tipo</button>
  <button class="chip" data-g="k" data-f="prova">Provas</button>
  <button class="chip" data-g="k" data-f="gabarito">Gabaritos</button>
  <button class="chip" data-g="k" data-f="outro">Outros</button>
 </div>
 <div class="prog"><div class="t"><span id="pt"></span><span id="pp"></span></div><div class="bar"><i id="pb"></i></div></div>
 <div class="forms" id="forms"></div>
 <div class="stats" id="st"></div>
 <main id="list"></main>
 <div class="drop" id="dz">Arraste PDFs ou uma pasta para cá</div>
</div>

<dialog id="dlg"><form method="dialog">
 <h3>Editar PDF</h3>
 <label>Título<input id="eT"></label>
 <label>Período (ex.: 2025-1)<input id="eP"></label>
 <label>Turma<input id="eU"></label>
 <label>Tipo<select id="eK"><option value="prova">Prova</option><option value="gabarito">Gabarito</option><option value="formulario">Formulário</option><option value="outro">Outro</option></select></label>
 <label>Vinculado a (prova ↔ gabarito)<select id="eL"></select></label>
 <menu><button class="b" value="cancel">Cancelar</button><button class="act" value="ok">Salvar</button></menu>
</form></dialog>

<div id="vw">
 <div id="tb">
  <button id="vp" title="Anterior">◀</button><button id="vn" title="Próximo">▶</button>
  <span class="ttl" id="vt"></span>
  <button id="mp">Prova</button><button id="mg">Gabarito</button><button id="ms" title="Prova e gabarito lado a lado">Lado a lado</button>
  <button id="fm" title="Abrir/fechar o formulário ao lado (R)">📐 Formulário</button>
  <button id="zo" title="Diminuir (−)">−</button><span id="zl">100%</span><button id="zi" title="Aumentar (+)">+</button><button id="zf" title="Ajustar à largura (0)">Largura</button>
  <button id="fs" title="Tela cheia (F)">⛶ Tela cheia</button>
  <label><input type="checkbox" class="ck" id="vd"> Feita</label>
  <button id="vx" title="Fechar (Esc)">✕</button>
 </div>
 <div id="panes"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="lib.js"></script>
<script>
const $=s=>document.querySelector(s);
let docs=[],view=[],fs_="all",fk="all",byId={};
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function refresh(){
 docs=await DB.all();byId=Object.fromEntries(docs.map(d=>[d.id,d]));
 docs.sort((a,b)=>(b.per||"").localeCompare(a.per||"")||(a.turma||"").localeCompare(b.turma||"")||a.title.localeCompare(b.title));
 render()}
function mainList(){return docs.filter(d=>d.kind!=="formulario"&&!(d.kind==="gabarito"&&d.pair&&byId[d.pair]))}
const formDoc=()=>docs.find(d=>d.kind==="formulario");

function render(){
 const q=$("#q").value.toLowerCase().trim(),base=mainList();
 view=base.filter(d=>{
  if(fs_==="todo"&&d.done)return false;if(fs_==="done"&&!d.done)return false;
  if(fk!=="all"&&d.kind!==fk)return false;
  return !q||(d.title+" "+d.per+" "+d.turma+" "+KIND[d.kind]).toLowerCase().includes(q)});
 const n=base.filter(d=>d.done).length,T=base.length;
 $("#pt").textContent=T?n+" de "+T+" feitas":"Nenhum PDF ainda";$("#pp").textContent=T?Math.round(100*n/T)+"%":"";$("#pb").style.width=T?(100*n/T)+"%":"0";
 const fm=docs.filter(d=>d.kind==="formulario");
 $("#forms").innerHTML=fm.length?"📐 Formulário: "+fm.map(d=>`<button class="b" data-o="${d.id}" data-m="prova">${esc(d.title)}</button> <button class="ic b" data-e="${d.id}">✏️</button> <button class="ic b" data-x="${d.id}">🗑</button>`).join(" "):"";
 $("#st").textContent=T?view.length+" de "+T+" itens":"";
 $("#list").innerHTML=view.map(d=>{
  const g=byId[d.pair];
  const btns=`<button class="b" data-o="${d.id}" data-m="prova">📄 Abrir</button>`+
   (g?`<button class="b g" data-o="${d.id}" data-m="gab">✅ Gabarito</button><button class="b" data-o="${d.id}" data-m="split">⇆ Lado a lado</button>`:(d.kind==="prova"?`<span class="off">sem gabarito</span>`:""))+
   `<a class="b" href="quiz.html?doc=${d.id}">🎯 Quiz</a><button class="ic b" data-e="${d.id}" title="Editar">✏️</button><button class="ic b" data-x="${d.id}" title="Remover">🗑</button>`;
  return `<div class="card${d.done?" done":""}"><input type="checkbox" class="ck" data-c="${d.id}" ${d.done?"checked":""} title="Marcar como feita"><div class="per">${esc(d.per||"–")}</div><div class="info"><b>${esc(d.turma||d.title)}</b><span>${esc(d.title)}</span><br><span class="tag">${KIND[d.kind]}</span></div><div class="btns">${btns}</div></div>`}).join("")}

$("#list").addEventListener("click",onClick);$("#forms").addEventListener("click",onClick);
async function onClick(e){
 const b=e.target.closest("button,a");if(!b)return;
 if(b.dataset.o)openV(b.dataset.o,b.dataset.m);
 else if(b.dataset.e)edit(b.dataset.e);
 else if(b.dataset.x)remove(b.dataset.x)}
$("#list").addEventListener("change",async e=>{const id=e.target.dataset.c;if(!id)return;const d=byId[id];d.done=e.target.checked;await DB.put(d);render()});
$("#q").oninput=render;
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
 document.querySelectorAll(`.chip[data-g="${c.dataset.g}"]`).forEach(x=>x.classList.remove("on"));c.classList.add("on");
 if(c.dataset.g==="s")fs_=c.dataset.f;else fk=c.dataset.f;render()});

/* ---- adicionar / editar / remover ---- */
$("#bAdd").onclick=()=>$("#fAdd").click();$("#bDir").onclick=()=>$("#fDir").click();
$("#fAdd").onchange=e=>add(e.target.files);$("#fDir").onchange=e=>add(e.target.files);
async function add(files){await addFiles([...files]);$("#fAdd").value="";$("#fDir").value="";refresh()}
$("#bPair").onclick=async()=>{await autoPair();refresh()};
["dragover","dragenter"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$("#dz").classList.add("over")}));
document.addEventListener("dragleave",e=>{if(!e.relatedTarget)$("#dz").classList.remove("over")});
document.addEventListener("drop",async e=>{e.preventDefault();$("#dz").classList.remove("over");
 const out=[];const items=e.dataTransfer.items;
 const walk=async en=>{if(en.isFile)out.push(await new Promise(r=>en.file(r)));else if(en.isDirectory){const rd=en.createReader();let all=[];for(;;){const part=await new Promise(r=>rd.readEntries(r));if(!part.length)break;all=all.concat(part)}for(const c of all)await walk(c)}};
 if(items&&items[0]&&items[0].webkitGetAsEntry){for(const it of items){const en=it.webkitGetAsEntry();if(en)await walk(en)}}else out.push(...e.dataTransfer.files);
 await addFiles(out);refresh()});

let editing=null;
function edit(id){
 const d=byId[id];editing=d;
 $("#eT").value=d.title;$("#eP").value=d.per;$("#eU").value=d.turma;$("#eK").value=d.kind;
 $("#eL").innerHTML='<option value="">(nenhum)</option>'+docs.filter(x=>x.id!==id&&(x.kind==="prova"||x.kind==="gabarito")).map(x=>`<option value="${x.id}">${esc((x.per||"–")+" · "+(x.turma||"")+" · "+KIND[x.kind]+" · "+x.title)}</option>`).join("");
 $("#eL").value=d.pair||"";$("#dlg").showModal()}
$("#dlg").addEventListener("close",async()=>{
 if($("#dlg").returnValue!=="ok"||!editing)return;
 const d=editing;editing=null;
 d.title=$("#eT").value.trim()||d.name;d.per=$("#eP").value.trim();d.turma=$("#eU").value.trim().toUpperCase();d.kind=$("#eK").value;
 const np=$("#eL").value;
 if(d.pair&&d.pair!==np){const o=byId[d.pair];if(o&&o.pair===d.id){o.pair="";await DB.put(o)}}
 d.pair=np;await DB.put(d);
 if(np){const o=byId[np];if(o){if(o.pair&&o.pair!==d.id){const oo=byId[o.pair];if(oo){oo.pair="";await DB.put(oo)}}o.pair=d.id;await DB.put(o)}}
 refresh()});
async function remove(id){
 const d=byId[id];if(!confirm('Remover "'+d.title+'" da biblioteca? (o arquivo original no seu computador não é apagado)'))return;
 for(const o of docs)if(o.pair===id){o.pair="";await DB.put(o)}
 await DB.del(id);refresh()}

/* ---- backup (só metadados; os PDFs não entram) ---- */
$("#bExp").onclick=()=>{
 const data=docs.map(d=>({name:d.name,size:d.size,title:d.title,per:d.per,turma:d.turma,kind:d.kind,done:d.done,pair:byId[d.pair]?byId[d.pair].name:""}));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,docs:data},null,1)],{type:"application/json"}));a.download="backup-visualizador-pdf.json";a.click()};
$("#bImp").onclick=()=>$("#fImp").click();
$("#fImp").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text()),mine=await DB.all();let n=0;
  for(const m of j.docs){const d=mine.find(x=>x.name===m.name&&x.size===m.size);if(!d)continue;
   Object.assign(d,{title:m.title,per:m.per,turma:m.turma,kind:m.kind,done:!!m.done});
   const p=mine.find(x=>x.name===m.pair);d.pair=p?p.id:"";n++;await DB.put(d)}
  alert(n+" PDFs restaurados. Os que não estão na biblioteca precisam ser adicionados de novo.")}
 catch(err){alert("Arquivo de backup inválido.")}
 e.target.value="";refresh()};

/* ===== visualizador ===== */
let cur=null,mode="prova",scale=1,fit=true,panes=[],tok=0,formOn=false;
try{formOn=localStorage.getItem("vpdf:form")==="1"}catch(e){}
function modeOf(r,m){const has=!!byId[r.pair];if(!has&&(m==="split"||m==="gab"))return"prova";return m}
function openV(id,m){cur=byId[id];mode=modeOf(cur,m);fit=true;$("#vw").classList.add("show");document.body.style.overflow="hidden";loadV()}
function closeV(){if(document.fullscreenElement)document.exitFullscreen();$("#vw").classList.remove("show");document.body.style.overflow="";$("#panes").innerHTML="";panes=[];cur=null}
function loadV(){
 const r=cur,g=byId[r.pair],fd=formDoc();
 $("#vt").textContent=(r.per?r.per+" · ":"")+(r.turma||r.title);
 $("#vd").checked=!!r.done;
 $("#mp").disabled=false;$("#mg").disabled=!g;$("#ms").disabled=!g;$("#fm").disabled=!fd;$("#fm").title=fd?"Abrir/fechar o formulário ao lado (R)":"Adicione um PDF do tipo Formulário na biblioteca";
 $("#mp").classList.toggle("on",mode==="prova");$("#mg").classList.toggle("on",mode==="gab");$("#ms").classList.toggle("on",mode==="split");$("#fm").classList.toggle("on",formOn&&!!fd);
 const i=view.indexOf(r);$("#vp").disabled=i<=0;$("#vn").disabled=i<0||i>=view.length-1;
 let items=mode==="split"?[[r,KIND[r.kind]],[g,"Gabarito"]]:mode==="gab"?[[g,"Gabarito"]]:[[r,KIND[r.kind]]];
 if(formOn&&fd&&!items.some(x=>x[0].id===fd.id))items.push([fd,"Formulário"]);
 const box=$("#panes");box.innerHTML="";panes=[];const my=++tok;
 items.forEach(([d,l])=>{
  const el=document.createElement("div");el.className="pane";el.innerHTML=`<div class="lab">${esc(l)}</div><div class="pg"><div class="msg">Carregando…</div></div>`;box.appendChild(el);
  const p={el,pdf:null};panes.push(p);
  d.blob.arrayBuffer().then(buf=>pdfjsLib.getDocument({data:buf}).promise).then(pdf=>{if(my!==tok)return;p.pdf=pdf;draw(p)})
   .catch(()=>{el.querySelector(".pg").innerHTML='<div class="msg">Não consegui abrir este PDF.</div>'})})}
async function draw(p){
 if(!p.pdf)return;const my=p.t=(p.t||0)+1;
 const pg=p.el.querySelector(".pg"),dpr=window.devicePixelRatio||1,first=await p.pdf.getPage(1);
 const fw=(p.el.clientWidth-24)/first.getViewport({scale:1}).width;
 let s=scale;if(fit){s=fw;if(panes.indexOf(p)===0)scale=fw}
 $("#zl").textContent=Math.round(scale*100)+"%";
 const frag=document.createDocumentFragment();
 for(let n=1;n<=p.pdf.numPages;n++){
  const page=await p.pdf.getPage(n);if(p.t!==my)return;
  const vp=page.getViewport({scale:s*dpr}),c=document.createElement("canvas");
  c.width=vp.width;c.height=vp.height;c.style.width=vp.width/dpr+"px";c.style.height=vp.height/dpr+"px";
  await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;if(p.t!==my)return;frag.appendChild(c)}
 const top=p.el.scrollTop/(p.el.scrollHeight||1);
 pg.innerHTML="";pg.appendChild(frag);p.el.scrollTop=top*p.el.scrollHeight}
function redraw(){panes.forEach(draw)}
function zoom(f){fit=false;scale=Math.min(5,Math.max(.3,scale*f));redraw()}
$("#zi").onclick=()=>zoom(1.2);$("#zo").onclick=()=>zoom(1/1.2);
$("#zf").onclick=()=>{fit=true;redraw()};
$("#mp").onclick=()=>{mode="prova";fit=true;loadV()};
$("#mg").onclick=()=>{mode="gab";fit=true;loadV()};
$("#ms").onclick=()=>{mode="split";fit=true;loadV()};
$("#fm").onclick=()=>{formOn=!formOn;try{localStorage.setItem("vpdf:form",formOn?"1":"0")}catch(e){}fit=true;loadV()};
$("#vx").onclick=()=>{closeV();render()};
$("#vd").onchange=async e=>{cur.done=e.target.checked;await DB.put(cur);render()};
$("#fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():$("#vw").requestFullscreen&&$("#vw").requestFullscreen()};
function go(d){const i=view.indexOf(cur)+d;if(i<0||i>=view.length)return;cur=view[i];mode=modeOf(cur,mode);fit=true;loadV()}
$("#vp").onclick=()=>go(-1);$("#vn").onclick=()=>go(1);
$("#panes").addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)}},{passive:false});
document.addEventListener("keydown",e=>{
 if(!cur||e.target.tagName==="INPUT"&&e.target.type==="search")return;
 if(e.key==="Escape"&&!document.fullscreenElement){closeV();render()}
 else if(e.key==="+"||e.key==="=")zoom(1.2);else if(e.key==="-")zoom(1/1.2);
 else if(e.key==="0")$("#zf").click();else if(e.key==="r"||e.key==="R")$("#fm").click();else if(e.key==="f"||e.key==="F")$("#fs").click()});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cur&&fit)redraw()},200)});
refresh();
</script></body></html>
